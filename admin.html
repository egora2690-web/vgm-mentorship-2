<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Админ-панель | ВолгГМУ</title>
    <link rel="stylesheet" href="kursorium.css">
    <script>document.documentElement.classList.add('k-js');setTimeout(function(){document.documentElement.classList.remove('k-js')},1500);</script>
    <style>
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .admin-stat {
            padding: 18px 16px;
            border: 1px solid var(--k-line);
            border-radius: 20px;
            background: #fff;
            text-align: center;
        }
        .admin-stat .ico { font-size: 1.6rem; margin-bottom: 6px; }
        .admin-stat .num { font-size: 1.5rem; font-weight: 800; line-height: 1.2; color: var(--k-text); }
        .admin-stat .lbl {
            margin-top: 4px; font-size: .7rem; font-weight: 700;
            letter-spacing: .04em; text-transform: uppercase; color: var(--k-muted);
        }
        .admin-stat.accent-green .num { color: var(--k-green-deep); }
        .admin-stat.accent-gold .num { color: #b8860b; }
        .admin-stat.accent-blue .num { color: #1a5fb4; }
        .admin-stat.accent-red .num { color: #c0392b; }

        .admin-tabs {
            display: flex; gap: 6px; flex-wrap: wrap;
            border-bottom: 1px solid var(--k-line); padding-bottom: 0; margin-bottom: 16px;
        }
        .admin-tab {
            padding: 12px 18px; border: 0; border-radius: 14px 14px 0 0;
            font: inherit; font-weight: 700; font-size: .9rem;
            background: var(--k-side); color: var(--k-muted); cursor: pointer;
            transition: background .15s, color .15s;
        }
        .admin-tab.is-active { background: var(--k-green-deep); color: #fff; }

        .admin-list {
            border: 1px solid var(--k-line); border-radius: 20px; background: #fff; overflow: hidden;
        }
        .admin-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
            padding: 16px 18px; border-bottom: 1px solid var(--k-line);
        }
        .admin-row:last-child { border-bottom: 0; }
        .admin-row:hover { background: var(--k-side); }
        .admin-ava {
            width: 44px; height: 44px; border-radius: 12px; background: var(--k-side);
            display: grid; place-items: center; overflow: hidden; flex-shrink: 0; color: var(--k-muted);
        }
        .admin-ava img { width: 100%; height: 100%; object-fit: cover; }
        .admin-ava svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .admin-info { flex: 1; min-width: 160px; }
        .admin-info h3 { margin: 0 0 2px; font-size: 1rem; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .admin-info p { margin: 0; font-size: .82rem; color: var(--k-muted); }
        .admin-badge {
            font-size: .65rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase;
            padding: 3px 8px; border-radius: 999px;
        }
        .admin-badge--admin { background: #fde8e8; color: #c0392b; }
        .admin-badge--pending { background: #fef6e4; color: #b8860b; }
        .admin-badge--approved { background: var(--k-green-soft); color: var(--k-green-deep); }
        .admin-badge--rejected { background: #fde8e8; color: #c0392b; }
        .admin-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
        .admin-btn {
            padding: 7px 12px; border: 0; border-radius: 10px;
            font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer;
            transition: background .15s;
        }
        .admin-btn--warn { background: #fef6e4; color: #b8860b; }
        .admin-btn--warn:hover { background: #fceec8; }
        .admin-btn--mute { background: var(--k-side); color: var(--k-muted); }
        .admin-btn--mute:hover { background: #e5e5e5; }
        .admin-btn--danger { background: #fde8e8; color: #c0392b; }
        .admin-btn--danger:hover { background: #fad2d2; }
        .admin-date { font-size: .78rem; color: var(--k-muted); white-space: nowrap; }

        html.k-contrast .admin-stat,
        html.k-contrast .admin-list { border: 2px solid #000; }
        html.k-contrast .admin-tab.is-active { background: #000; }
        html.k-contrast .admin-badge { border: 1px solid #000; }
        html.k-contrast .admin-badge--admin,
        html.k-contrast .admin-badge--rejected { background: #ffe600; color: #000; }
        html.k-contrast .admin-badge--pending { background: #ffe600; color: #000; }
        html.k-contrast .admin-badge--approved { background: #ffe600; color: #000; }
        html.k-contrast .admin-btn { border: 1px solid #000; }
    </style>
</head>
<body data-k-lang="ru" data-k-active="account" data-k-ru="admin.html" data-k-en="admin.html">

<main class="k-content">

    <div id="accessDenied" class="k-state" hidden>
        <div class="k-state-ico">🚫</div>
        <h3>Доступ запрещён</h3>
        <p>У вас нет прав администратора</p>
        <a href="profile1.html" class="k-btn k-btn--green">Вернуться в профиль</a>
    </div>

    <div id="adminPanel" hidden>

        <div class="k-page-head">
            <h1 class="k-page-title">Админ-панель</h1>
            <p class="k-page-sub">Управление пользователями и заявками платформы наставничества</p>
        </div>

        <section>
            <h2 class="k-section-title" style="margin-bottom:14px;">Статистика</h2>
            <div id="statsGrid" class="admin-stats">
                <div class="admin-stat"><div class="k-spinner" style="margin:12px auto;"></div></div>
            </div>
        </section>

        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center;justify-content:space-between;">
            <div class="admin-tabs" role="tablist" style="margin:0;">
                <button type="button" role="tab" id="usersTabBtn" class="admin-tab is-active" onclick="switchTab('users')" aria-selected="true">👥 Пользователи</button>
                <button type="button" role="tab" id="requestsTabBtn" class="admin-tab" onclick="switchTab('requests')" aria-selected="false">📋 Заявки</button>
                <button type="button" role="tab" id="reportsTabBtn" class="admin-tab" onclick="switchTab('reports')" aria-selected="false">⚠ Жалобы</button>
            </div>
            <button type="button" class="k-btn k-btn--soft k-btn--sm" onclick="downloadBackup()">💾 Скачать бэкап БД</button>
        </div>

        <section id="usersTab" role="tabpanel">
            <div class="k-panel" style="margin-bottom:12px;padding:14px 18px;">
                <div class="k-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input class="k-input" type="text" id="userSearchInput" placeholder="Поиск по имени, логину, роли..." autocomplete="off" oninput="filterUsers()">
                </div>
            </div>
            <div class="admin-list">
                <div id="usersLoading" class="k-state" style="padding:32px;">
                    <div class="k-spinner"></div>
                </div>
                <div id="usersList"></div>
            </div>
        </section>

        <section id="requestsTab" role="tabpanel" hidden>
            <div class="k-panel" style="margin-bottom:12px;padding:14px 18px;">
                <div class="k-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input class="k-input" type="text" id="requestSearchInput" placeholder="Поиск по заявкам..." autocomplete="off" oninput="filterRequests()">
                </div>
            </div>
            <div class="admin-list">
                <div id="requestsLoading" class="k-state" style="padding:32px;">
                    <div class="k-spinner"></div>
                </div>
                <div id="requestsList"></div>
            </div>
        </section>

        <section id="reportsTab" role="tabpanel" hidden>
            <div class="admin-list">
                <div id="reportsLoading" class="k-state" style="padding:32px;"><div class="k-spinner"></div></div>
                <div id="reportsList"></div>
            </div>
        </section>

    </div>

</main>

<script src="shell.js"></script>
<script>
const API_URL = '/api';
let currentUser = null;
let allUsers = [];
let allRequests = [];

function checkAdmin() {
    const saved = localStorage.getItem('vgm_current_user');
    if (!saved) {
        document.getElementById('accessDenied').hidden = false;
        return false;
    }
    currentUser = JSON.parse(saved);
    if (!currentUser.is_admin) {
        document.getElementById('accessDenied').hidden = false;
        return false;
    }
    document.getElementById('adminPanel').hidden = false;
    return true;
}

function adminHeaders() {
    return {
        'Content-Type': 'application/json',
        'x-user-id': String(currentUser.id)
    };
}

function switchTab(tab) {
    ['users','requests','reports'].forEach(t => {
        const btn = document.getElementById(t + 'TabBtn');
        const panel = document.getElementById(t + 'Tab');
        if (btn) {
            btn.classList.toggle('is-active', tab === t);
            btn.setAttribute('aria-selected', tab === t);
        }
        if (panel) panel.hidden = tab !== t;
    });
    if (tab === 'reports') loadReports();
}
}

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

async function loadStats() {
    try {
        const response = await fetch(`${API_URL}/admin/stats`, { headers: adminHeaders() });
        const stats = await response.json();
        document.getElementById('statsGrid').innerHTML = `
            <div class="admin-stat">
                <div class="ico">👥</div>
                <div class="num">${stats.total_users ?? 0}</div>
                <div class="lbl">Всего пользователей</div>
            </div>
            <div class="admin-stat accent-green">
                <div class="ico">🎓</div>
                <div class="num">${stats.total_mentors ?? 0}</div>
                <div class="lbl">Наставники</div>
            </div>
            <div class="admin-stat accent-blue">
                <div class="ico">👨‍🎓</div>
                <div class="num">${stats.total_mentees ?? 0}</div>
                <div class="lbl">Подопечные</div>
            </div>
            <div class="admin-stat">
                <div class="ico">📋</div>
                <div class="num">${stats.total_requests ?? 0}</div>
                <div class="lbl">Заявок</div>
            </div>
            <div class="admin-stat accent-gold">
                <div class="ico">⏳</div>
                <div class="num">${stats.pending_requests ?? 0}</div>
                <div class="lbl">Ожидают</div>
            </div>
            <div class="admin-stat accent-green">
                <div class="ico">✅</div>
                <div class="num">${stats.approved_requests ?? 0}</div>
                <div class="lbl">Одобрено</div>
            </div>
            <div class="admin-stat">
                <div class="ico">💬</div>
                <div class="num">${stats.total_messages ?? 0}</div>
                <div class="lbl">Сообщений</div>
            </div>`;
    } catch (error) {
        console.error(error);
        document.getElementById('statsGrid').innerHTML =
            '<p style="color:#c0392b;font-weight:700">Не удалось загрузить статистику</p>';
    }
}

async function loadUsers() {
    try {
        const response = await fetch(`${API_URL}/admin/users`, { headers: adminHeaders() });
        allUsers = await response.json();
        document.getElementById('usersLoading').hidden = true;
        renderUsers();
    } catch (error) {
        console.error(error);
        document.getElementById('usersLoading').innerHTML =
            '<p style="color:#c0392b;font-weight:700">Ошибка загрузки</p>';
    }
}

function filterUsers() {
    renderUsers();
}
function filterRequests() {
    renderRequests();
}

function renderUsers() {
    const list = document.getElementById('usersList');
    if (!Array.isArray(allUsers) || allUsers.length === 0) {
        list.innerHTML = '<p class="k-state" style="padding:28px;">Нет пользователей</p>';
        return;
    }

    const q = (document.getElementById('userSearchInput')?.value || '').trim().toLowerCase();
    const filtered = !q ? allUsers : allUsers.filter(u => {
        const blob = [u.name, u.login, u.role, u.direction?.name, u.direction?.level].filter(Boolean).join(' ').toLowerCase();
        return blob.includes(q);
    });

    if (filtered.length === 0) {
        list.innerHTML = '<p class="k-state" style="padding:28px;">Ничего не найдено</p>';
        return;
    }

    const personSvg = '<svg viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>';

    list.innerHTML = filtered.map(u => {
        const isSelf = u.id === currentUser.id;
        const avatarHTML = u.avatar
            ? `<img src="${u.avatar}" alt="">`
            : personSvg;
        const directionInfo = u.direction
            ? `<p>${escapeHtml(u.direction.name)} · ${escapeHtml(u.direction.level)}</p>`
            : '';
        const adminBadge = u.is_admin
            ? '<span class="admin-badge admin-badge--admin">👑 Админ</span>'
            : '';
        const blockedBadge = u.is_blocked
            ? '<span class="admin-badge" style="background:#fee2e2;color:#991b1b;">Заблокирован</span>'
            : '';
        const date = u.created_at ? new Date(u.created_at).toLocaleDateString('ru-RU') : '—';

        return `
            <div class="admin-row">
                <div class="admin-ava">${avatarHTML}</div>
                <div class="admin-info">
                    <h3>${escapeHtml(u.name)} ${adminBadge} ${blockedBadge}</h3>
                    <p>@${escapeHtml(u.login)} · ${escapeHtml(u.role || '')}</p>
                    ${directionInfo}
                </div>
                <div class="admin-date">${date}</div>
                <div class="admin-actions">
                    ${!u.is_admin ? `
                        <button type="button" class="admin-btn admin-btn--warn" onclick="makeAdmin(${u.id})">👑 Сделать админом</button>
                    ` : (isSelf ? '' : `
                        <button type="button" class="admin-btn admin-btn--mute" onclick="removeAdmin(${u.id})">Снять админа</button>
                    `)}
                    ${!isSelf ? `
                        <button type="button" class="admin-btn ${u.is_blocked ? 'admin-btn--mute' : 'admin-btn--danger'}" onclick="toggleBlock(${u.id}, ${u.is_blocked ? 0 : 1})">${u.is_blocked ? 'Разблокировать' : '🔒 Блок'}</button>
                        <button type="button" class="admin-btn admin-btn--danger" onclick="deleteUser(${u.id}, ${JSON.stringify(u.name)})">🗑 Удалить</button>
                    ` : ''}
                </div>
            </div>`;
    }).join('');
}

async function toggleBlock(id, blocked) {
    if (blocked && !confirm('Заблокировать пользователя?')) return;
    try {
        const r = await fetch(`${API_URL}/admin/users/${id}/block`, {
            method: 'PUT',
            headers: { ...adminHeaders(), 'Content-Type': 'application/json' },
            body: JSON.stringify({ blocked: !!blocked })
        });
        if (r.ok) loadUsers();
        else alert('Ошибка');
    } catch (e) { alert('Ошибка сети'); }
}

async function loadReports() {
    const loading = document.getElementById('reportsLoading');
    const list = document.getElementById('reportsList');
    if (loading) loading.hidden = false;
    try {
        const r = await fetch(`${API_URL}/admin/reports`, { headers: adminHeaders() });
        const rows = await r.json();
        if (loading) loading.hidden = true;
        if (!Array.isArray(rows) || !rows.length) {
            list.innerHTML = '<p class="k-state" style="padding:28px;">Жалоб нет</p>';
            return;
        }
        list.innerHTML = rows.map(x => `
            <div class="admin-row">
                <div class="admin-info">
                    <h3>${escapeHtml(x.target_type)} #${x.target_id}</h3>
                    <p>от ${escapeHtml(x.reporter_name || '—')} · ${escapeHtml(x.reason || 'без причины')}</p>
                    <p style="font-size:.8rem;color:var(--k-muted)">${x.created_at || ''} · ${escapeHtml(x.status || '')}</p>
                </div>
            </div>`).join('');
    } catch (e) {
        if (loading) loading.innerHTML = '<p style="color:#c0392b">Ошибка загрузки</p>';
    }
}

function downloadBackup() {
    const a = document.createElement('a');
    a.href = `${API_URL}/admin/backup`;
    // fetch with header then blob
    fetch(`${API_URL}/admin/backup`, { headers: adminHeaders() })
        .then(r => {
            if (!r.ok) throw new Error('fail');
            return r.blob();
        })
        .then(blob => {
            const url = URL.createObjectURL(blob);
            a.href = url;
            a.download = 'vgm-backup.db';
            a.click();
            URL.revokeObjectURL(url);
        })
        .catch(() => alert('Не удалось скачать бэкап'));
}

async function loadRequests() {
    try {
        const response = await fetch(`${API_URL}/admin/requests`, { headers: adminHeaders() });
        allRequests = await response.json();
        document.getElementById('requestsLoading').hidden = true;
        renderRequests();
    } catch (error) {
        console.error(error);
        document.getElementById('requestsLoading').innerHTML =
            '<p style="color:#c0392b;font-weight:700">Ошибка загрузки</p>';
    }
}

function renderRequests() {
    const list = document.getElementById('requestsList');
    if (!Array.isArray(allRequests) || allRequests.length === 0) {
        list.innerHTML = '<p class="k-state" style="padding:28px;">Нет заявок</p>';
        return;
    }

    const q = (document.getElementById('requestSearchInput')?.value || '').trim().toLowerCase();
    const filtered = !q ? allRequests : allRequests.filter(r => {
        const blob = [r.from_name, r.to_name, r.message, r.status].filter(Boolean).join(' ').toLowerCase();
        return blob.includes(q);
    });

    if (filtered.length === 0) {
        list.innerHTML = '<p class="k-state" style="padding:28px;">Ничего не найдено</p>';
        return;
    }

    list.innerHTML = filtered.map(r => {
        let statusBadge = '';
        if (r.status === 'pending') statusBadge = '<span class="admin-badge admin-badge--pending">⏳ Ожидает</span>';
        else if (r.status === 'approved') statusBadge = '<span class="admin-badge admin-badge--approved">✅ Одобрена</span>';
        else if (r.status === 'rejected') statusBadge = '<span class="admin-badge admin-badge--rejected">❌ Отклонена</span>';

        const date = r.created_at ? new Date(r.created_at).toLocaleDateString('ru-RU') : '—';

        return `
            <div class="admin-row" style="flex-direction:column;align-items:stretch;">
                <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start;">
                    <div>
                        <h3 style="margin:0 0 4px;font-size:1rem;">${escapeHtml(r.from_name)} → ${escapeHtml(r.to_name)}</h3>
                        <p style="margin:0;font-size:.82rem;color:var(--k-muted);">${date}</p>
                    </div>
                    ${statusBadge}
                </div>
                ${r.message ? `<p style="margin:8px 0 0;font-size:.92rem;color:var(--k-text);">«${escapeHtml(r.message)}»</p>` : ''}
                <div class="admin-actions" style="margin-top:10px;">
                    <button type="button" class="admin-btn admin-btn--danger" onclick="deleteRequest(${r.id})">🗑 Удалить заявку</button>
                </div>
            </div>`;
    }).join('');
}

async function makeAdmin(id) {
    if (!confirm('Сделать пользователя админом?')) return;
    await fetch(`${API_URL}/admin/users/${id}/make-admin`, { method: 'PUT', headers: adminHeaders() });
    loadUsers();
}

async function removeAdmin(id) {
    if (!confirm('Снять права админа?')) return;
    await fetch(`${API_URL}/admin/users/${id}/remove-admin`, { method: 'PUT', headers: adminHeaders() });
    loadUsers();
}

async function deleteUser(id, name) {
    if (!confirm(`Удалить пользователя «${name}»? Это действие нельзя отменить!`)) return;
    await fetch(`${API_URL}/admin/users/${id}`, { method: 'DELETE', headers: adminHeaders() });
    loadUsers();
    loadStats();
}

async function deleteRequest(id) {
    if (!confirm('Удалить заявку?')) return;
    await fetch(`${API_URL}/admin/requests/${id}`, { method: 'DELETE', headers: adminHeaders() });
    loadRequests();
    loadStats();
}

if (checkAdmin()) {
    loadStats();
    loadUsers();
    loadRequests();
}
</script>
</body>
</html>
