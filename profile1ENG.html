        const LEVEL_TO_STATUS = {
            "Bachelor's Degree": "Bachelor's student",
            'Specialist Degree': 'Specialist student',
            "Master's Degree": "Master's student",
            'College': 'College student',
            'Residency': 'Resident',
            'Postgraduate': 'Postgraduate student'
        };
        // Reverse mapping: status -> direction level
        const STATUS_TO_LEVEL = Object.fromEntries(Object.entries(LEVEL_TO_STATUS).map(([lvl, st]) => [st, lvl]));
        let ALL_DIRECTIONS_HTML = '';

        // Keeps only the directions that belong to the selected status
        function filterDirections(p) {
            const sel = document.getElementById(p + '-direction');
            if (!sel || !ALL_DIRECTIONS_HTML) return;
            const level = STATUS_TO_LEVEL[document.getElementById(p + '-status').value];
            const prev = sel.value;

            const tmp = document.createElement('select');
            tmp.innerHTML = ALL_DIRECTIONS_HTML;
            const placeholder = tmp.querySelector('option[value=""]');
            let html = placeholder ? placeholder.outerHTML : '<option value=""></option>';
            tmp.querySelectorAll('optgroup').forEach(g => {
                const first = g.querySelector('option');
                try {
                    if (!level || JSON.parse(first.value).level === level) html += g.outerHTML;
                } catch (e) {}
            });
            sel.innerHTML = html;
            sel.value = [...sel.options].some(o => o.value === prev) ? prev : '';
            updateDirectionDetails(p);
        }

            "Ultrasound Diagnostics",

            "X-ray Endovascular Diagnostics and Treatment"
];

        const INPUT_CLS = 'w-full bg-slate-50 border border-slate-100 p-3 rounded-xl font-semibold text-slate-700 outline-none focus:border-emerald-500 transition';
        const LABEL_CLS = 'block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2';

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function optionsHTML(list) {
            return list.map(x => `<option>${esc(x)}</option>`).join('');
        }
        function statusOptionsHTML() {
            return '<option value="">Select status</option>' + STATUSES.map(s => `<option>${esc(s.t)}</option>`).join('');
        }

        // Physician / researcher blocks and the About me field (same for registration and editing)
        function buildExtraFields(p) {
            const workplaceOpts = WORKPLACES.map(g => `<optgroup label="${esc(g.label)}">${optionsHTML(g.items)}</optgroup>`).join('');
            return `
            <div id="${p}-blk-doctor" class="hidden space-y-4">

                    <label class="${LABEL_CLS}">Place of work</label>
                    <select id="${p}-workplace" class="${INPUT_CLS}" onchange="toggleOther('${p}', 'workplace')">
                        <option value="">Select medical organization</option>
                        ${workplaceOpts}
                        <option value="__other">Other (specify)</option>
                    </select>
                    <input type="text" id="${p}-workplace-other" placeholder="Organization name" class="${INPUT_CLS} mt-2 hidden">
                </div>
                <div>
                    <label class="${LABEL_CLS}">Medical specialty</label>
                    <select id="${p}-specialty" class="${INPUT_CLS}" onchange="toggleOther('${p}', 'specialty')">

                        ${optionsHTML(SPECIALTIES)}
                        <option value="__other">Other (specify)</option>
                    </select>
                    <input type="text" id="${p}-specialty-other" placeholder="Specialty name" class="${INPUT_CLS} mt-2 hidden">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="${LABEL_CLS}">Experience, years</label>
                        <input type="number" id="${p}-experience" min="0" max="60" class="${INPUT_CLS}">
                    </div>
                    <div>
                        <label class="${LABEL_CLS}">Qualification category</label>
                        <select id="${p}-category" class="${INPUT_CLS}">
                            <option value="">None</option>
                            <option>Second</option>
                            <option>First</option>
                            <option>Highest</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="${p}-blk-science" class="hidden space-y-4">
                <div>
                    <label class="${LABEL_CLS}">Academic degree</label>
                    <select id="${p}-degree" class="${INPUT_CLS}">
                        <option value="">None</option>
                        <option>Candidate of Sciences (PhD)</option>
                        <option>Doctor of Sciences</option>
                    </select>
                </div>
                <div>
                    <label class="${LABEL_CLS}">Research area</label>
                    <input type="text" id="${p}-research" placeholder="For example, clinical pharmacology" class="${INPUT_CLS}">
                </div>
                <div>
                    <label class="${LABEL_CLS}">eLibrary or ORCID profile (optional)</label>
                    <input type="url" id="${p}-link" placeholder="https://" class="${INPUT_CLS}">
                </div>
            </div>

            <div>
                <label class="${LABEL_CLS}">About me (optional)</label>
                <textarea id="${p}-about" rows="4" maxlength="1000" placeholder="What you do, how you can help, or what you want to learn" class="${INPUT_CLS}"></textarea>
                <div id="${p}-about-counter" class="text-right text-xs text-slate-400 mt-1">0 / 1000</div>
            </div>`;
        }

        function toggleOther(p, field) {
            const sel = document.getElementById(`${p}-${field}`);
            document.getElementById(`${p}-${field}-other`).classList.toggle('hidden', sel.value !== '__other');
        }
        function setSelectOrOther(p, field, value) {
            const sel = document.getElementById(`${p}-${field}`);
            const other = document.getElementById(`${p}-${field}-other`);
            other.value = '';
            other.classList.add('hidden');
            if (!value) { sel.value = ''; return; }
            if ([...sel.options].some(o => o.value === value)) {
                sel.value = value;
            } else {
                sel.value = '__other';
                other.value = value;
                other.classList.remove('hidden');
            }
        }
        function readSelectOrOther(p, field) {
            const sel = document.getElementById(`${p}-${field}`);
            return sel.value === '__other'
                ? document.getElementById(`${p}-${field}-other`).value.trim()
                : sel.value;
        }

        function updateAboutCounter(p) {
            const len = document.getElementById(p + '-about').value.length;
            document.getElementById(p + '-about-counter').innerText = len + ' / 1000';
        }

        // Show the right blocks depending on status
        function onStatusChange(p) {
            filterDirections(p);
            const st = STATUSES.find(s => s.t === document.getElementById(p + '-status').value);
            const type = st ? st.type : '';
            document.getElementById(p + '-study-block').classList.toggle('hidden', type !== 'study');
            document.getElementById(p + '-blk-doctor').classList.toggle('hidden', type !== 'doctor');
            document.getElementById(p + '-blk-science').classList.toggle('hidden', type !== 'science');
        }

        function resetExtra(p) {
            ['status', 'direction', 'course', 'workplace', 'workplace-other', 'specialty', 'specialty-other',
             'experience', 'category', 'degree', 'research', 'link', 'about'].forEach(id => {
                const el = document.getElementById(p + '-' + id);
                if (el) el.value = '';
            });
            document.getElementById(p + '-workplace-other').classList.add('hidden');
            document.getElementById(p + '-specialty-other').classList.add('hidden');
            const det = document.getElementById(p + '-direction-details');
            if (det) { det.classList.remove('show'); det.innerHTML = ''; }
            onStatusChange(p);
            updateAboutCounter(p);
        }

        // Collects profile data. Everything goes into the direction object,
        // so the server stores it as before (no backend changes).
        function collectProfile(p) {
            const $ = id => document.getElementById(p + '-' + id);
            const st = STATUSES.find(s => s.t === $('status').value);
            if (!st) return { error: 'Please select your status!' };

            let dir;
            if (st.type === 'study') {
                const opt = $('direction').options[$('direction').selectedIndex];
                if (!opt || !opt.value) return { error: 'Please select a direction!' };
                try { dir = JSON.parse(opt.value); } catch (e) { return { error: 'Error in direction data!' }; }
                if ($('course').value) dir.course = $('course').value;
            } else if (st.type === 'doctor') {
                const workplace = readSelectOrOther(p, 'workplace');
                const specialty = readSelectOrOther(p, 'specialty');
                if (!workplace) return { error: 'Please specify your place of work!' };
                if (!specialty) return { error: 'Please specify your medical specialty!' };
                dir = { level: 'Practicing physician', name: specialty, form: workplace, workplace: workplace };
                if ($('experience').value) dir.experience = $('experience').value;
                if ($('category').value) dir.category = $('category').value;
            } else {
                const research = $('research').value.trim();
                if (!research) return { error: 'Please specify your research area!' };
                const link = $('link').value.trim();
                if (link && !/^https?:\/\//i.test(link)) return { error: 'The link must start with http:// or https://' };
                dir = { level: 'Researcher', name: research, form: $('degree').value || 'No degree', research: research };
                if ($('degree').value) dir.degree = $('degree').value;
                if (link) dir.link = link;
            }

            dir.status = st.t;
            dir.statusType = st.type;
            dir.about = $('about').value.trim();
            return { direction: dir };
        }

        // Show status / place of work / About me in the account
        function renderProfileExtra() {
            const d = (currentUser && currentUser.direction) || {};
            const parts = [];
            if (d.status) parts.push(d.status);
            if (d.statusType === 'doctor') {
                if (d.workplace) parts.push(d.workplace);
                if (d.experience) parts.push(d.experience + ' years of experience');
                if (d.category) parts.push(d.category + ' category');
            } else if (d.statusType === 'science') {
                if (d.degree) parts.push(d.degree);
            } else if (d.course) {
                parts.push('Year ' + d.course);
            }
            const line = document.getElementById('profile-extra-line');
            line.innerText = parts.join(' · ');
            line.classList.toggle('hidden', parts.length === 0);

            const about = document.getElementById('profile-about');
            about.innerText = d.about || '';
            about.classList.toggle('hidden', !d.about);
        }

        let regAvatarDataURL = null;
        let editAvatarDataURL = null;
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", function() {
            // The direction list in the edit window = the full list from registration
            ALL_DIRECTIONS_HTML = document.getElementById('reg-direction').innerHTML;
            document.getElementById('edit-direction').innerHTML = document.getElementById('reg-direction').innerHTML;

            ['reg', 'edit'].forEach(p => {
                document.getElementById(p + '-status').innerHTML = statusOptionsHTML();
                document.getElementById(p + '-extra').innerHTML = buildExtraFields(p);
                document.getElementById(p + '-about').addEventListener('input', () => updateAboutCounter(p));
            });
            checkAuth();
        });

        function switchAuthTab(tab) {
            document.getElementById('loginTab').classList.remove('active');
            document.getElementById('registerTab').classList.remove('active');
            document.getElementById('loginTabBtn').classList.remove('active');
            document.getElementById('registerTabBtn').classList.remove('active');
            
            if (tab === 'login') {
                document.getElementById('loginTab').classList.add('active');
                document.getElementById('loginTabBtn').classList.add('active');
            } else {
                document.getElementById('registerTab').classList.add('active');
                document.getElementById('registerTabBtn').classList.add('active');
            }
        }

        function updateDirectionDetails(prefix) {
            const select = document.getElementById(prefix + '-direction');
            const detailsDiv = document.getElementById(prefix + '-direction-details');
            const selectedOption = select.options[select.selectedIndex];
            
            if (!selectedOption || !selectedOption.value) {
                detailsDiv.classList.remove('show');
                detailsDiv.innerHTML = '';
                return;
            }

            try {
                const data = JSON.parse(selectedOption.value);
                
                let html = `<div class="detail-row"><span class="detail-label">Level</span><span class="detail-value">${data.level}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">Direction</span><span class="detail-value">${data.name}</span></div>`;
                
                if (data.code) {
                    html += `<div class="detail-row"><span class="detail-label">Direction Code</span><span class="detail-value code">${data.code}</span></div>`;
                }
                
                if (data.description) {
                    html += `<div class="detail-description">${data.description}</div>`;
                }
                
                html += `<div class="detail-row"><span class="detail-label">Study Format</span><span class="detail-value">${data.form}</span></div>`;
                html += `<div class="detail-row"><span class="detail-label">Study Duration</span><span class="detail-value">${data.duration}</span></div>`;
                
                detailsDiv.innerHTML = html;
                detailsDiv.classList.add('show');
            } catch (e) {
                detailsDiv.classList.remove('show');
                detailsDiv.innerHTML = '';
            }
        }

        function previewAvatar(event, previewId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const dataURL = e.target.result;
                const previewEl = document.getElementById(previewId);
                previewEl.innerHTML = `<img src="${dataURL}" class="w-full h-full object-cover">`;
                if (previewId === 'reg-avatar-preview') {
                    regAvatarDataURL = dataURL;
                } else if (previewId === 'edit-avatar-preview') {
                    editAvatarDataURL = dataURL;
                }
            };
            reader.readAsDataURL(file);
        }

        async function registerUser() {
            const login = document.getElementById("reg-login").value.trim();
            const name = document.getElementById("reg-name").value.trim();
            const role = document.getElementById("reg-role").value;
            const password = document.getElementById("reg-password").value;
            const passwordConfirm = document.getElementById("reg-password-confirm").value;

            if (!login || !name || !password || !passwordConfirm) {
                alert("Please fill in all required fields!");
                return;
            }
            if (password !== passwordConfirm) {
                alert("Passwords do not match!");
                return;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters!");
                return;
            }

            const prof = collectProfile('reg');
            if (prof.error) {
                alert(prof.error);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login, name, password, role,
                        direction: prof.direction,
                        avatar: regAvatarDataURL
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Registration error');
                    return;
                }

                currentUser = data.user;
                localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                alert('Registration successful!');
                checkAuth();

            } catch (error) {
                console.error(error);
                alert('Could not connect to server.');
            }
        }

        async function loginUser() {
            const login = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value;

            if (!login || !password) {
                alert("Enter username and password!");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || 'Login error');
                    return;
                }

                currentUser = data.user;
                localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                checkAuth();

            } catch (error) {
                console.error(error);
                alert('Could not connect to server.');
            }
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem('vgm_current_user');
            checkAuth();
        }

        function checkAuth() {
            const saved = localStorage.getItem('vgm_current_user');
            
            if (saved) {
                currentUser = JSON.parse(saved);
                
                document.getElementById("authBlock").classList.add("hidden");
                document.getElementById("profileBlock").classList.remove("hidden");
                
                document.getElementById("profile-name").innerText = currentUser.name;
                document.getElementById("profile-status").innerText = currentUser.role;
                
                if (currentUser.direction) {
                    document.getElementById("profile-tag").innerText = currentUser.direction.name;
                    document.getElementById("profile-level").innerText = currentUser.direction.level;
                }
                
                renderProfileExtra();
                updateProfileAvatar(currentUser.avatar);
                loadRequestsCount();
            } else {
                document.getElementById("authBlock").classList.remove("hidden");
                document.getElementById("profileBlock").classList.add("hidden");
                
                document.getElementById("reg-login").value = '';
                document.getElementById("reg-name").value = '';
                document.getElementById("reg-password").value = '';
                document.getElementById("reg-password-confirm").value = '';
                document.getElementById("login-username").value = '';
                document.getElementById("login-password").value = '';
                document.getElementById("reg-avatar-file").value = '';
                regAvatarDataURL = null;
                
                const preview = document.getElementById('reg-avatar-preview');
                preview.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;
                
                resetExtra('reg');
            }
        }

        function updateProfileAvatar(dataURL) {
            const img = document.getElementById('profile-avatar');
            const placeholder = document.getElementById('avatar-placeholder-icon');
            const container = document.getElementById('avatar-container');
            if (dataURL && dataURL !== 'null' && dataURL !== '') {
                img.src = dataURL;
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
                container.classList.remove('avatar-placeholder');
            } else {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
                container.classList.add('avatar-placeholder');
            }
        }

        async function loadRequestsCount() {
            if (!currentUser) return;
            
            try {
                const response = await fetch(`${API_URL}/requests/${currentUser.id}`);
                const requests = await response.json();
                
                const incomingPending = requests.filter(r => 
                    r.to_user_id === currentUser.id && r.status === 'pending'
                ).length;
                
                const badge = document.getElementById('requestsBadge');
                if (badge) {
                    if (incomingPending > 0) {
                        badge.innerText = incomingPending;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('Error loading requests:', e);
            }
        }

        function openEditModal() {
            if (!currentUser) return;
            const d = currentUser.direction || {};
            
            document.getElementById("input-name").value = currentUser.name || '';
            
            const roleSelect = document.getElementById("input-role");
            if ((currentUser.role || '').includes("Mentor")) {
                roleSelect.value = "Mentor VolgGMU";
            } else {
                roleSelect.value = "Mentee";
            }
            
            // Status (for old profiles it is inferred from the direction level)
            const statusLabel = d.status || LEVEL_TO_STATUS[d.level] || '';
            document.getElementById('edit-status').value = statusLabel;
            onStatusChange('edit');

            // Direction (study)
            const editSelect = document.getElementById("edit-direction");
            editSelect.value = '';
            let matched = null;
            for (const opt of editSelect.options) {
                if (!opt.value) continue;
                try {
                    const o = JSON.parse(opt.value);
                    if (o.name === d.name && o.level === d.level && o.form === d.form) { matched = opt; break; }
                    if (!matched && o.name === d.name && o.level === d.level) matched = opt;
                } catch (e) {}
            }
            if (matched && (!d.statusType || d.statusType === 'study')) editSelect.value = matched.value;
            updateDirectionDetails('edit');
            document.getElementById('edit-course').value = d.course || '';

            // Physician
            setSelectOrOther('edit', 'workplace', d.statusType === 'doctor' ? (d.workplace || '') : '');
            setSelectOrOther('edit', 'specialty', d.statusType === 'doctor' ? (d.name || '') : '');
            document.getElementById('edit-experience').value = d.experience || '';
            document.getElementById('edit-category').value = d.category || '';

            // Researcher
            document.getElementById('edit-degree').value = d.degree || '';
            document.getElementById('edit-research').value = d.statusType === 'science' ? (d.research || d.name || '') : '';
            document.getElementById('edit-link').value = d.link || '';

            // About me
            document.getElementById('edit-about').value = d.about || '';
            updateAboutCounter('edit');
            
            const previewEl = document.getElementById('edit-avatar-preview');
            if (currentUser.avatar) {
                previewEl.innerHTML = `<img src="${currentUser.avatar}" class="w-full h-full object-cover">`;
                editAvatarDataURL = currentUser.avatar;
            } else {
                previewEl.innerHTML = `<svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;
                editAvatarDataURL = null;
            }
            document.getElementById('edit-avatar-file').value = '';
            
            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
        }

        async function saveChanges() {
            if (!currentUser) return;
            
            const newName = document.getElementById("input-name").value.trim();
            const newRole = document.getElementById("input-role").value;

            const prof = collectProfile('edit');
            if (prof.error) {
                alert(prof.error);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${currentUser.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: newName || currentUser.name,
                        role: newRole,
                        direction: prof.direction,
                        avatar: editAvatarDataURL
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('vgm_current_user', JSON.stringify(data.user));
                    
                    document.getElementById("profile-name").innerText = currentUser.name;
                    document.getElementById("profile-status").innerText = currentUser.role;
                    
                    if (currentUser.direction) {
                        document.getElementById("profile-tag").innerText = currentUser.direction.name;
                        document.getElementById("profile-level").innerText = currentUser.direction.level;
                    }
                    
                    renderProfileExtra();
                    updateProfileAvatar(currentUser.avatar);
                    closeEditModal();
                } else {
                    alert(data.error || 'Save error');
                }

            } catch (error) {
                console.error(error);
                alert('Could not connect to server');
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById("editModal");
            if (event.target == modal) {
                closeEditModal();
            }
        }
    </script>

</body>
</html>
