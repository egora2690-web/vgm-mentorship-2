<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Chats | VolgSMU</title>
    <link rel="stylesheet" href="kursorium.css">
    <script>document.documentElement.classList.add('k-js');setTimeout(function(){document.documentElement.classList.remove('k-js')},1500);</script>
    <style>
        /* Страница чатов — компоненты поверх kursorium */
        .chat-list { display: flex; flex-direction: column; gap: 10px; }
        .chat-item {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px; border: 1px solid var(--k-line); border-radius: 20px;
            background: #fff; text-decoration: none; color: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .chat-item:hover { border-color: var(--k-green); box-shadow: 0 8px 24px rgba(5, 98, 86, .08); }
        .chat-avatar {
            flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px;
            background: var(--k-side); display: grid; place-items: center;
            overflow: hidden; color: var(--k-muted); font-size: 1.4rem;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-avatar svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .chat-body { flex: 1; min-width: 0; }
        .chat-title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .chat-title { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-badge {
            flex-shrink: 0; font-size: .7rem; font-weight: 700; letter-spacing: .03em;
            text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
            background: var(--k-green-soft); color: var(--k-green-deep);
        }
        .chat-preview { margin: 0; font-size: .9rem; color: var(--k-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
        .chat-unread {
            min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
            background: var(--k-green-deep); color: #fff;
            font-size: .72rem; font-weight: 800; display: grid; place-items: center;
        }
        .chat-time { font-size: .72rem; color: var(--k-muted); white-space: nowrap; }
        html.k-contrast .chat-unread { background: #000; border: 1px solid #000; }

        /* Модалка создания чата */
        .chat-modal-overlay {
            position: fixed; inset: 0; z-index: 80;
            background: rgba(0,0,0,.4); display: none;
            align-items: center; justify-content: center; padding: 16px;
        }
        .chat-modal-overlay.is-open { display: flex; }
        .chat-modal {
            width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto;
            background: #fff; border-radius: 28px; padding: 24px;
            box-shadow: 0 24px 60px rgba(0,0,0,.2);
        }
        .chat-modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .chat-modal-head h3 { margin: 0; font-size: 1.25rem; font-weight: 800; }
        .chat-modal-close {
            width: 36px; height: 36px; border: 0; border-radius: 50%;
            background: var(--k-side); font-size: 1.3rem; line-height: 1; cursor: pointer; color: var(--k-muted);
        }
        .chat-modal-close:hover { background: #e5e5e5; color: var(--k-text); }
        .chat-type-tabs { display: flex; border: 1px solid var(--k-line); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
        .chat-type-tabs button {
            flex: 1; padding: 12px; border: 0; font: inherit; font-weight: 700; font-size: .9rem;
            background: var(--k-side); color: var(--k-muted); cursor: pointer; transition: background .15s, color .15s;
        }
        .chat-type-tabs button.is-active { background: var(--k-green-deep); color: #fff; }
        .chat-field { margin-bottom: 14px; }
        .chat-field label {
            display: block; margin-bottom: 6px;
            font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--k-muted);
        }
        .chat-search-results { max-height: 180px; overflow-y: auto; margin-bottom: 12px; }
        .chat-user-btn {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 8px 10px; border: 0; border-radius: 12px; background: transparent;
            text-align: left; cursor: pointer; font: inherit;
        }
        .chat-user-btn:hover { background: var(--k-side); }
        .chat-user-btn .ava {
            width: 36px; height: 36px; border-radius: 10px; background: var(--k-side);
            display: grid; place-items: center; overflow: hidden; flex-shrink: 0; font-size: 1rem;
        }
        .chat-user-btn .ava img { width: 100%; height: 100%; object-fit: cover; }
        .chat-user-btn strong { display: block; font-size: .9rem; }
        .chat-user-btn span { font-size: .78rem; color: var(--k-muted); }
        .chat-selected { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .chat-selected-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-radius: 12px; background: var(--k-green-soft);
        }
        .chat-selected-item .left { display: flex; align-items: center; gap: 8px; }
        .chat-selected-item .ava {
            width: 28px; height: 28px; border-radius: 8px; background: #fff;
            display: grid; place-items: center; overflow: hidden; font-size: .85rem;
        }
        .chat-selected-item .ava img { width: 100%; height: 100%; object-fit: cover; }
        .chat-selected-item strong { font-size: .88rem; color: var(--k-green-deep); }
        .chat-selected-item button {
            border: 0; background: none; color: #c0392b; font-size: 1.2rem; font-weight: 700; cursor: pointer; line-height: 1;
        }

        /* Высокий контраст */
        html.k-contrast .chat-item,
        html.k-contrast .chat-modal { border: 2px solid #000; }
        html.k-contrast .chat-item:hover { border-color: #000; box-shadow: none; }
        html.k-contrast .chat-badge { background: #ffe600; color: #000; border: 1px solid #000; }
        html.k-contrast .chat-type-tabs button.is-active { background: #000; color: #fff; }
        html.k-contrast .chat-selected-item { background: #ffe600; border: 1px solid #000; }
        html.k-contrast .chat-selected-item strong { color: #000; }
    </style>
</head>
<body data-k-lang="en" data-k-active="chats" data-k-ru="chats.html" data-k-en="chatsENG.html">

<main class="k-content">

    <div class="k-page-head" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
            <h1 class="k-page-title">Chats</h1>
            <p class="k-page-sub">Personal and group conversations with mentors and mentees</p>
        </div>
        <button type="button" class="k-btn k-btn--green k-btn--sm" onclick="openCreateModal()">+ Create chat</button>
    </div>

    <section class="k-panel" aria-label="Search chats">
        <div class="k-field" style="margin:0;">
            <label for="searchInput">Search</label>
            <div class="k-search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input class="k-input" type="text" id="searchInput" placeholder="Chat name or person..." autocomplete="off">
            </div>
        </div>
    </section>

    <section>
        <div id="loadingState" class="k-state">
            <div class="k-spinner"></div>
            <p>Loading chats...</p>
        </div>

        <div id="chatsList" class="chat-list" hidden></div>

        <div id="emptyState" class="k-state" hidden>
            <div class="k-state-ico">💬</div>
            <h3>No chats yet</h3>
            <p>Create a chat or start a conversation via a mentorship request</p>
            <button type="button" class="k-btn k-btn--green" onclick="openCreateModal()">+ Create chat</button>
        </div>
    </section>

</main>

<!-- Модалка создания чата -->
<div id="createModal" class="chat-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
    <div class="chat-modal">
        <div class="chat-modal-head">
            <h3 id="createModalTitle">Create chat</h3>
            <button type="button" class="chat-modal-close" onclick="closeCreateModal()" aria-label="Close">×</button>
        </div>

        <div class="chat-type-tabs">
            <button type="button" id="personalTabBtn" class="is-active" onclick="switchType('personal')">👤 Personal</button>
            <button type="button" id="groupTabBtn" onclick="switchType('group')">👥 Group</button>
        </div>

        <div id="groupNameField" class="chat-field" hidden>
            <label for="groupName">Group name</label>
            <input class="k-input" type="text" id="groupName" placeholder="e.g. Group-2026" autocomplete="off">
        </div>

        <div class="chat-field">
            <label for="userSearch">Find users</label>
            <input class="k-input" type="text" id="userSearch" placeholder="Enter a name..." autocomplete="off" oninput="searchUsers(this.value)">
        </div>

        <div id="searchResults" class="chat-search-results"></div>
        <div id="selectedUsers" class="chat-selected"></div>

        <button type="button" class="k-btn k-btn--green k-btn--block" onclick="createChat()">Create</button>
    </div>
</div>

<script src="shell.js"></script>
<script>
const API_URL = '/api';
let currentUser = null;
let allChats = [];
let filteredChats = [];
let chatType = 'personal';
let selectedUsers = [];
let searchTimeout = null;

function checkAuth() {
    const saved = localStorage.getItem('vgm_current_user');
    if (!saved) {
        alert('Please sign in');
        window.location.href = 'profile1ENG.html';
        return false;
    }
    currentUser = JSON.parse(saved);
    return true;
}

async function loadChats() {
    try {
        const response = await fetch(`${API_URL}/chats/${currentUser.id}`, {
            headers: { 'x-user-id': String(currentUser.id) }
        });
        const data = await response.json();
        allChats = Array.isArray(data) ? data : [];
        filterChats();
        document.getElementById('loadingState').hidden = true;
    } catch (error) {
        console.error(error);
        document.getElementById('loadingState').innerHTML =
            '<p style="color:#c0392b;font-weight:700">Load error. Make sure the server is running.</p>';
    }
}

function filterChats() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredChats = allChats.filter(c => {
        if (!search) return true;
        const name = (c.display_name || '').toLowerCase();
        return name.includes(search);
    });
    renderChats();
}

function renderChats() {
    const list = document.getElementById('chatsList');
    const empty = document.getElementById('emptyState');

    if (filteredChats.length === 0) {
        list.hidden = true;
        empty.hidden = false;
        return;
    }

    empty.hidden = true;
    list.hidden = false;

    const personSvg = '<svg viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>';

    list.innerHTML = filteredChats.map(chat => {
        let avatarHTML;
        if (chat.display_avatar) {
            avatarHTML = `<img src="${chat.display_avatar}" alt="">`;
        } else if (chat.is_group) {
            avatarHTML = '👥';
        } else {
            avatarHTML = personSvg;
        }

        const lastMsg = chat.last_message
            ? chat.last_message.substring(0, 48) + (chat.last_message.length > 48 ? '…' : '')
            : 'No messages';

        let timeStr = '';
        if (chat.last_message_at) {
            const d = new Date(chat.last_message_at);
            const today = new Date();
            timeStr = d.toDateString() === today.toDateString()
                ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        }

        const unread = chat.unread_count > 0
            ? `<span class="chat-unread">${chat.unread_count > 99 ? '99+' : chat.unread_count}</span>`
            : '';

        return `
            <a href="chat-newENG.html?id=${chat.id}" class="chat-item">
                <div class="chat-avatar">${avatarHTML}</div>
                <div class="chat-body">
                    <div class="chat-title-row">
                        <h3 class="chat-title">${escapeHtml(chat.display_name || 'Untitled')}</h3>
                        ${chat.is_group ? '<span class="chat-badge">Group</span>' : ''}
                    </div>
                    <p class="chat-preview" style="${chat.unread_count > 0 ? 'font-weight:700;color:var(--k-text)' : ''}">${escapeHtml(lastMsg)}</p>
                </div>
                <div class="chat-meta">
                    ${timeStr ? `<span class="chat-time">${timeStr}</span>` : ''}
                    ${unread}
                </div>
            </a>`;
    }).join('');
}

function escapeHtml(str) {
    return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(new RegExp('<', 'g'), '&lt;')
        .replace(new RegExp('>', 'g'), '&gt;')
        .replace(new RegExp('"', 'g'), '&quot;');
}

function switchType(type) {
    chatType = type;
    document.getElementById('personalTabBtn').classList.toggle('is-active', type === 'personal');
    document.getElementById('groupTabBtn').classList.toggle('is-active', type === 'group');
    document.getElementById('groupNameField').hidden = type !== 'group';
}

function openCreateModal() {
    selectedUsers = [];
    document.getElementById('userSearch').value = '';
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('selectedUsers').innerHTML = '';
    document.getElementById('groupName').value = '';
    switchType('personal');
    document.getElementById('createModal').classList.add('is-open');
    document.getElementById('userSearch').focus();
}

function closeCreateModal() {
    document.getElementById('createModal').classList.remove('is-open');
}

function searchUsers(query) {
    clearTimeout(searchTimeout);
    if (!query || query.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
    }
    searchTimeout = setTimeout(async () => {
        try {
            const response = await fetch(`${API_URL}/users/search?q=${encodeURIComponent(query)}`);
            const users = await response.json();
            const results = (Array.isArray(users) ? users : []).filter(u => u.id !== currentUser.id);

            document.getElementById('searchResults').innerHTML = results.map(u => `
                <button type="button" class="chat-user-btn"
                    onclick="addUser(${u.id}, ${JSON.stringify(u.name)}, ${JSON.stringify(u.avatar || '')})">
                    <div class="ava">${u.avatar ? `<img src="${u.avatar}" alt="">` : '👤'}</div>
                    <div>
                        <strong>${escapeHtml(u.name)}</strong>
                        <span>${escapeHtml(u.role || '')}</span>
                    </div>
                </button>
            `).join('') || '<p style="text-align:center;color:var(--k-muted);font-size:.9rem;padding:8px 0">Nothing found</p>';
        } catch (e) {
            console.error(e);
        }
    }, 300);
}

function addUser(id, name, avatar) {
    if (selectedUsers.find(u => u.id === id)) return;
    if (chatType === 'personal' && selectedUsers.length >= 1) {
        alert('Personal chat allows only one person');
        return;
    }
    selectedUsers.push({ id, name, avatar });
    renderSelectedUsers();
    document.getElementById('userSearch').value = '';
    document.getElementById('searchResults').innerHTML = '';
}

function removeUser(id) {
    selectedUsers = selectedUsers.filter(u => u.id !== id);
    renderSelectedUsers();
}

function renderSelectedUsers() {
    document.getElementById('selectedUsers').innerHTML = selectedUsers.map(u => `
        <div class="chat-selected-item">
            <div class="left">
                <div class="ava">${u.avatar ? `<img src="${u.avatar}" alt="">` : '👤'}</div>
                <strong>${escapeHtml(u.name)}</strong>
            </div>
            <button type="button" onclick="removeUser(${u.id})" aria-label="Remove">×</button>
        </div>
    `).join('');
}

async function createChat() {
    if (selectedUsers.length === 0) {
        alert('Select at least one user');
        return;
    }
    if (chatType === 'personal' && selectedUsers.length !== 1) {
        alert('Personal chat needs exactly one participant');
        return;
    }
    const name = document.getElementById('groupName').value.trim();
    if (chatType === 'group' && !name) {
        alert('Enter a group name');
        return;
    }

    try {
        const response = await fetch(`${API_URL}/chats`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-user-id': String(currentUser.id)
            },
            body: JSON.stringify({
                name: chatType === 'group' ? name : null,
                is_group: chatType === 'group',
                member_ids: selectedUsers.map(u => u.id),
                created_by: currentUser.id
            })
        });
        const data = await response.json();
        if (response.ok) {
            closeCreateModal();
            window.location.href = `chat-newENG.html?id=${data.chat_id}`;
        } else {
            alert(data.error || 'Failed to create chat');
        }
    } catch (e) {
        console.error(e);
        alert('Could not create chat');
    }
}

document.getElementById('searchInput').addEventListener('input', filterChats);

document.getElementById('createModal').addEventListener('click', function (e) {
    if (e.target === this) closeCreateModal();
});
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeCreateModal();
});

if (checkAuth()) {
    loadChats();
}
</script>
</body>
</html>
