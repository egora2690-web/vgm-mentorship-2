<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mentor Catalog | VolgSMU</title>
    <link rel="stylesheet" href="kursorium.css">
    <script>document.documentElement.classList.add('k-js');setTimeout(function(){document.documentElement.classList.remove('k-js')},1500);</script>
</head>
<body data-k-lang="en" data-k-active="catalog" data-k-ru="catalog.html" data-k-en="catalogENG.html">

<main class="k-content">

    <div class="k-page-head">
        <h1 class="k-page-title">Mentor catalog</h1>
        <p class="k-page-sub">Choose a mentor by direction, level or name</p>
    </div>

    <section class="k-panel" aria-label="Filters">
        <div class="k-filters">
            <div class="k-field">
                <label for="searchInput">Search by name</label>
                <div class="k-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input class="k-input" type="text" id="searchInput" placeholder="Enter name or login..." autocomplete="off">
                </div>
            </div>
            <div class="k-field">
                <label for="levelFilter">Level</label>
                <select class="k-select" id="levelFilter"></select>
            </div>
            <div class="k-field">
                <label for="directionFilter">Direction</label>
                <select class="k-select" id="directionFilter"></select>
            </div>
        </div>
        <div class="k-panel-foot">
            <span id="resultsCount">Loading...</span>
            <button class="k-link-btn" type="button" onclick="resetFilters()">Reset filters</button>
        </div>
    </section>

    <section>
        <div id="mentorsGrid" class="k-grid"></div>

        <div id="emptyState" class="k-state" hidden>
            <div class="k-state-ico">🔍</div>
            <h3>Nothing found</h3>
            <p>Try changing filters or search</p>
            <button class="k-btn k-btn--green" type="button" onclick="resetFilters()">Reset filters</button>
        </div>

        <div id="loadingState" class="k-state">
            <div class="k-spinner"></div>
            <p>Loading mentors...</p>
        </div>
    </section>
</main>

<script src="shell.js"></script>
<script>

const API_URL = '/api';
const I = {"lang": "en", "allLevels": "All levels", "allDirs": "All directions", "found": "Found", "noDirection": "Direction not specified", "noReviews": "No reviews yet", "view": "View profile", "loadError": "Loading error. Make sure the server is running."};
const PROFILE_URL = 'profile-viewENG.html';

// Уровни: русские и английские значения из базы считаются одним уровнем
const LEVELS = [
    { key: 'bachelor',   raws: ['Бакалавриат', "Bachelor's Degree"],       ru: 'Бакалавриат',   en: "Bachelor's Degree" },
    { key: 'specialist', raws: ['Специалитет', 'Specialist Degree'],        ru: 'Специалитет',   en: 'Specialist Degree' },
    { key: 'master',     raws: ['Магистратура', "Master's Degree"],         ru: 'Магистратура',  en: "Master's Degree" },
    { key: 'college',    raws: ['СПО', 'College'],                          ru: 'СПО (Колледж)', en: 'College' },
    { key: 'residency',  raws: ['Ординатура', 'Residency'],                 ru: 'Ординатура',    en: 'Residency' },
    { key: 'postgrad',   raws: ['Аспирантура', 'Postgraduate'],             ru: 'Аспирантура',   en: 'Postgraduate' },
    { key: 'doctor',     raws: ['Практикующий врач', 'Practicing physician'], ru: 'Практикующий врач', en: 'Practicing physician' },
    { key: 'scientist',  raws: ['Научный сотрудник', 'Researcher'],         ru: 'Научный сотрудник', en: 'Researcher' }
];

let allMentors = [];
let filteredMentors = [];

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function levelKey(raw) {
    const l = LEVELS.find(x => x.raws.includes(raw));
    return l ? l.key : null;
}
function levelLabel(raw) {
    const l = LEVELS.find(x => x.raws.includes(raw));
    return l ? l[I.lang] : raw;
}

function buildLevelOptions() {
    const sel = document.getElementById('levelFilter');
    sel.innerHTML = `<option value="">${esc(I.allLevels)}</option>` +
        LEVELS.map(l => `<option value="${l.key}">${esc(l[I.lang])}</option>`).join('');
}

// Список направлений строится из реальных данных и зависит от выбранного уровня
function buildDirectionOptions() {
    const sel = document.getElementById('directionFilter');
    const level = document.getElementById('levelFilter').value;
    const prev = sel.value;
    const names = [...new Set(allMentors
        .filter(m => m.direction && m.direction.name && (!level || levelKey(m.direction.level) === level))
        .map(m => m.direction.name))].sort((a, b) => a.localeCompare(b, I.lang));
    sel.innerHTML = `<option value="">${esc(I.allDirs)}</option>` +
        names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    sel.value = names.includes(prev) ? prev : '';
}

async function loadMentors() {
    try {
        const response = await fetch(`${API_URL}/mentors-with-rating`);
        const data = await response.json();
        allMentors = data;
        buildDirectionOptions();
        applyFilters();
    } catch (error) {
        console.error(error);
        document.getElementById('loadingState').innerHTML = `<p class="k-error">${esc(I.loadError)}</p>`;
    }
}

function applyFilters() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const level = document.getElementById('levelFilter').value;
    const direction = document.getElementById('directionFilter').value;

    filteredMentors = allMentors.filter(m => {
        if (search) {
            const matchName = (m.name || '').toLowerCase().includes(search);
            const matchLogin = (m.login || '').toLowerCase().includes(search);
            if (!matchName && !matchLogin) return false;
        }
        if (level && (!m.direction || levelKey(m.direction.level) !== level)) return false;
        if (direction && (!m.direction || m.direction.name !== direction)) return false;
        return true;
    });

    renderMentors();
}

function renderMentors() {
    const grid = document.getElementById('mentorsGrid');
    const empty = document.getElementById('emptyState');
    const loading = document.getElementById('loadingState');
    const count = document.getElementById('resultsCount');

    loading.hidden = true;

    if (filteredMentors.length === 0) {
        grid.innerHTML = '';
        empty.hidden = false;
        count.innerText = `${I.found}: 0`;
        return;
    }

    empty.hidden = true;
    count.innerText = `${I.found}: ${filteredMentors.length}`;

    grid.innerHTML = filteredMentors.map(mentor => {
        const d = mentor.direction || null;
        const avatarHTML = mentor.avatar
            ? `<img src="${esc(mentor.avatar)}" alt="${esc(mentor.name)}">`
            : `<svg viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;

        const directionName = d ? `${esc(d.name)} • ${esc(levelLabel(d.level))}` : esc(I.noDirection);

        // чипы: статус, место работы / степень
        const chips = [];
        if (d && d.status) chips.push(`<span class="k-chip">${esc(d.status)}</span>`);
        if (d && d.statusType === 'doctor' && d.workplace) chips.push(`<span class="k-chip k-chip--gray">${esc(d.workplace)}</span>`);
        if (d && d.statusType === 'science' && d.degree) chips.push(`<span class="k-chip k-chip--gray">${esc(d.degree)}</span>`);
        const chipsHTML = chips.length ? `<div class="k-chips">${chips.join('')}</div>` : '';

        const aboutHTML = d && d.about ? `<p class="k-mentor-about">${esc(d.about)}</p>` : '';

        const ratingHTML = mentor.reviews_count > 0
            ? `<b>⭐ ${esc(mentor.avg_rating)}</b> <span>(${esc(mentor.reviews_count)})</span>`
            : `<span>⭐ ${esc(I.noReviews)}</span>`;

        return `
            <article class="k-mentor">
                <div class="k-mentor-top">
                    <div class="k-avatar">${avatarHTML}</div>
                    <div>
                        <h3>${esc(mentor.name)}</h3>
                        <p class="k-mentor-dir">${directionName}</p>
                    </div>
                </div>
                ${chipsHTML}
                ${aboutHTML}
                <p class="k-rating">${ratingHTML}</p>
                <a class="k-btn k-btn--green k-btn--block" href="${PROFILE_URL}?id=${encodeURIComponent(mentor.id)}">${esc(I.view)}</a>
            </article>
        `;
    }).join('');
}

function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('levelFilter').value = '';
    buildDirectionOptions();
    document.getElementById('directionFilter').value = '';
    applyFilters();
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('levelFilter').addEventListener('change', () => { buildDirectionOptions(); applyFilters(); });
document.getElementById('directionFilter').addEventListener('change', applyFilters);

buildLevelOptions();
buildDirectionOptions();
loadMentors();

</script>

</body>
</html>
