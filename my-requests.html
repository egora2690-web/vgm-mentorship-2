<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мои заявки | ВолгГМУ</title>
    <link rel="stylesheet" href="kursorium.css">
    <script>document.documentElement.classList.add('k-js');setTimeout(function(){document.documentElement.classList.remove('k-js')},1500);</script>
</head>
<body data-k-lang="ru" data-k-active="requests" data-k-ru="my-requests.html" data-k-en="my-requestsENG.html">

<main class="k-content">

    <div class="k-page-head">
        <h1 class="k-page-title">Мои заявки</h1>
        <p class="k-page-sub">Входящие и отправленные заявки на наставничество</p>
    </div>

    <div class="k-tabs" role="tablist">
        <button class="k-tab is-active" id="incomingTabBtn" type="button" role="tab" onclick="switchTab('incoming')">📥 Входящие</button>
        <button class="k-tab" id="outgoingTabBtn" type="button" role="tab" onclick="switchTab('outgoing')">📤 Исходящие</button>
    </div>

    <section>
        <div id="loadingState" class="k-state">
            <div class="k-spinner"></div>
            <p>Загрузка заявок...</p>
        </div>

        <div id="requestsList" class="k-list" hidden></div>

        <div id="emptyState" class="k-state" hidden>
            <div class="k-state-ico">📭</div>
            <h3>Заявок пока нет</h3>
            <p>Здесь появятся заявки от студентов</p>
            <a class="k-btn k-btn--green" href="catalog.html">Найти наставника</a>
        </div>

        <div id="authError" class="k-state" hidden>
            <div class="k-state-ico">🔒</div>
            <h3>Вы не авторизованы</h3>
            <p>Войдите, чтобы посмотреть заявки</p>
            <a class="k-btn k-btn--green" href="profile1.html">Войти</a>
        </div>
    </section>
</main>

<script src="shell.js"></script>
<script>

const API_URL = '/api';
const I = {"locale": "ru-RU", "loadError": "Ошибка загрузки заявок", "noIncoming": "Входящих заявок нет", "noOutgoing": "Вы ещё не отправляли заявки", "pending": "Ожидает", "approved": "Одобрена", "rejected": "Отклонена", "approve": "Одобрить", "decline": "Отклонить", "openChat": "Открыть чат", "user": "Пользователь", "incomingNote": "хочет работать с вами", "outgoingNote": "вы отправили заявку", "confirmDecline": "Точно отклонить заявку?", "approvedAlert": "Заявка одобрена! Чат создан.", "error": "Ошибка", "updateFail": "Не удалось обновить заявку"};
let currentUser = null;
let allRequests = [];
let currentTab = 'incoming';

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Ссылки на чат: только http(s) или адреса этого же сайта
function safeHref(u) {
    try {
        const x = new URL(u, location.href);
        return (x.protocol === 'http:' || x.protocol === 'https:' || x.protocol === location.protocol) ? u : '#';
    } catch (e) { return '#'; }
}

function checkAuth() {
    const saved = localStorage.getItem('vgm_current_user');
    if (!saved) {
        document.getElementById('loadingState').hidden = true;
        document.getElementById('authError').hidden = false;
        return false;
    }
    currentUser = JSON.parse(saved);
    return true;
}

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('incomingTabBtn').classList.toggle('is-active', tab === 'incoming');
    document.getElementById('outgoingTabBtn').classList.toggle('is-active', tab === 'outgoing');
    renderRequests();
}

async function loadRequests() {
    if (!checkAuth()) return;

    try {
        const response = await fetch(`${API_URL}/requests/${currentUser.id}`);
        const data = await response.json();
        allRequests = data;
        renderRequests();
    } catch (error) {
        console.error(error);
        document.getElementById('loadingState').innerHTML = `<p class="k-error">${esc(I.loadError)}</p>`;
    }
}

function renderRequests() {
    const list = document.getElementById('requestsList');
    const empty = document.getElementById('emptyState');

    document.getElementById('loadingState').hidden = true;

    const filtered = currentTab === 'incoming'
        ? allRequests.filter(r => r.to_user_id === currentUser.id)
        : allRequests.filter(r => r.from_user_id === currentUser.id);

    if (filtered.length === 0) {
        list.innerHTML = '';
        list.hidden = true;
        empty.hidden = false;
        document.querySelector('#emptyState h3').innerText = currentTab === 'incoming' ? I.noIncoming : I.noOutgoing;
        return;
    }

    empty.hidden = true;
    list.hidden = false;

    list.innerHTML = filtered.map(req => {
        const isIncoming = req.to_user_id === currentUser.id;
        const otherName = isIncoming ? req.from_name : req.to_name;
        const otherAvatar = isIncoming ? req.from_avatar : req.to_avatar;

        const avatarHTML = otherAvatar
            ? `<img src="${esc(otherAvatar)}" alt="">`
            : `<svg viewBox="0 0 24 24"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>`;

        let statusBadge = '';
        if (req.status === 'pending') statusBadge = `<span class="k-status k-status--pending">⏳ ${esc(I.pending)}</span>`;
        else if (req.status === 'approved') statusBadge = `<span class="k-status k-status--approved">✅ ${esc(I.approved)}</span>`;
        else if (req.status === 'rejected') statusBadge = `<span class="k-status k-status--rejected">❌ ${esc(I.rejected)}</span>`;

        let actionsHTML = '';
        if (isIncoming && req.status === 'pending') {
            actionsHTML = `
                <div class="k-req-actions">
                    <button class="k-btn k-btn--green k-btn--sm" type="button" onclick="updateRequest(${Number(req.id)}, 'approved')">✅ ${esc(I.approve)}</button>
                    <button class="k-btn k-btn--soft k-btn--sm" type="button" onclick="updateRequest(${Number(req.id)}, 'rejected')">❌ ${esc(I.decline)}</button>
                </div>`;
        } else if (req.status === 'approved' && req.chat_link) {
            actionsHTML = `<div class="k-req-actions"><a class="k-btn k-btn--green k-btn--sm" href="${esc(safeHref(req.chat_link))}">💬 ${esc(I.openChat)}</a></div>`;
        }

        const date = new Date(req.created_at).toLocaleDateString(I.locale, {
            day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        return `
            <article class="k-req">
                <div class="k-req-head">
                    <div class="k-avatar">${avatarHTML}</div>
                    <div class="k-req-body">
                        <div class="k-req-title">
                            <div>
                                <h3>${esc(otherName || I.user)}</h3>
                                <small>${esc(isIncoming ? I.incomingNote : I.outgoingNote)}</small>
                            </div>
                            ${statusBadge}
                        </div>
                        <time>${esc(date)}</time>
                    </div>
                </div>
                ${req.message ? `<div class="k-msg">${esc(req.message)}</div>` : ''}
                ${actionsHTML}
            </article>
        `;
    }).join('');
}

async function updateRequest(id, status) {
    if (status === 'rejected' && !confirm(I.confirmDecline)) return;

    try {
        const response = await fetch(`${API_URL}/requests/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });

        const data = await response.json();

        if (response.ok) {
            if (status === 'approved') alert(I.approvedAlert);
            loadRequests();
        } else {
            alert(data.error || I.error);
        }
    } catch (error) {
        console.error(error);
        alert(I.updateFail);
    }
}

loadRequests();

</script>

</body>
</html>
